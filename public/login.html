<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Command Academy Login</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#0b1020;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.login-box{
    background:#141c35;
    padding:30px;
    border-radius:15px;
    width:350px;
    text-align:center;
    color:white;
    box-shadow:0 0 20px rgba(0,255,255,.2);
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:8px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#00d4ff;
    color:black;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

#message{
    margin-top:15px;
}
</style>
</head>
<script type="module">

import {
    auth,
    onAuthStateChanged
} from "./firebase-config.js";

onAuthStateChanged(auth, (user) => {

    if(user){
        window.location.href = "index.html";
    }

});

</script>
<body>

<div class="login-box">

<h2>AI Command Academy</h2>

<input type="email" id="email" placeholder="Email">

<input type="password" id="password" placeholder="Password">

<button onclick="login()">Login</button>

<p id="message"></p>

</div>

<script type="module">

import { auth, signInWithEmailAndPassword }
from "./firebase-config.js";

window.login = async function(){

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

try {

await signInWithEmailAndPassword(
auth,
email,
password
);

window.location.href = "index.html";

} catch(error){

document.getElementById("message").innerHTML =
error.message;

}

}

</script>

</body>
</html>
